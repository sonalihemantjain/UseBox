name: UseBox CI/CD

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Stop Existing Containers
        run: |
          docker compose down || true

      - name: Build and Start Containers
        run: |
          docker compose up -d --build

      - name: Verify Running Containers
        run: |
          docker ps
